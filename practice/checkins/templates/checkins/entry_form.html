{% extends 'base.html' %}

{% block title %}ثبت حال امروز - PulseCheck{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5" style="min-height: 75vh;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card card-form shadow-sm p-4 border rounded-3 bg-white">
            <h4 class="card-title text-center mb-4 fw-bold text-dark">ثبت حال امروز</h4>
            
            <form method="post" class="d-flex flex-column gap-3">
                {% csrf_token %}

                <div>
                    <label for="{{ django_form.score.id_for_label }}" class="form-label text-muted small">امتیاز (Score)</label>
                    {{ django_form.score }}
                </div>

                <div>
                    <label for="{{ django_form.reason.id_for_label }}" class="form-label text-muted small">دلیل (Reason)</label>
                    {{ django_form.reason }}
                </div>

                <div>
                    <label for="{{ django_form.energy_level.id_for_label }}" class="form-label text-muted small">سطح انرژی (Energy Level)</label>
                    {{ django_form.energy_level }}
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 mt-3 fw-bold" style="border-radius: 8px;">
                    ثبت اطلاعات
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
